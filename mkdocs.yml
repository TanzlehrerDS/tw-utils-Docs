site_name: tw-utils Doku
site_description: Anleitungen und Hilfen für tw-utils — Tools für Die Stämme
site_url: https://docs.tw-utils.net/

theme:
  name: material
  language: de
  favicon: assets/logo.png
  features:
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Zu Dark Mode wechseln
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Zu Light Mode wechseln

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - assets/yt-consent.js
  - assets/doc-stale.js

copyright: >
  &copy; 2026 tw-utils &middot;
  <a href="https://tw-utils.net/impressum/#impressum" target="_blank" rel="noopener">Impressum</a>
  &middot;
  <a href="https://tw-utils.net/datenschutz/#datenschutz" target="_blank" rel="noopener">Datenschutz</a>

plugins:
  - search
  - glightbox:
      auto_caption: true
      caption_position: bottom
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: de
          default: true
          name: Deutsch
          build: true
        - locale: en
          name: English
          build: true
          site_name: tw-utils Docs
          nav_translations:
            Startseite: Home
            Off-Planungstool: Nuke-Planning
            AG-Planungstool: Snob-Planning
            Zwischencleaner & Fake-UT: Cleaner & Fake-Sup
            Der Leaderview: Leader-View
            Discordbot: Discordbot
            Video-Tutorial: Video Tutorial
            "Schritt 1: Truppen": "Step 1: Troops"
            "Schritt 2: Abschickzeiten": "Step 2: Launch times"
            "Schritt 3: Ankunftszeiten": "Step 3: Arrival Times"
            "Schritt 4: Angriffsplanung": "Step 4: Attack planning"
            "Schritt 5: Fakeplanung": "Step 5: Fake planning"
            "Schritt 6: Übersicht": "Step 6: Overview"
            "Schritt 7: Berechnung": "Step 7: Calculation"
            "Schritt 8: Ergebnis": "Step 8: Results"
            Die Gesamtkarte: The Overall Map
            "Schritt 2: Befehle": "Step 2: Commands"
            "Schritt 3: Cleaner": "Step 3: Cleaner"
            "Schritt 4: Fake-UT": "Step 4: Fake-Sup"
            "Schritt 5: Ergebnis": "Step 5: Results"
            Die zwei Wege: The Two Ways
            "Schritt 1: AG-Meldungen": "Step 1: Snob-Entries"
            "Schritt 2: Zieldörfer": "Step 2: Targets"
            "Schritt 3: Einstellungen": "Step 3: Settings"
            "Schritt 4: Ergebnis": "Step 4: Results"
            "Meine Pläne & Container": "My Plans & Containers"
            Gespeicherte Pläne: Saved Plans
            Veröffentlichte Container: Published Containers
            Übersicht: Overview
            Berechtigung: Permission
            Mitglieder: Members
            Truppen: Troops
            Bunker-Info: Bunker-Info
            Stammes-Umfragen: Tribe Surveys
            "Planung (Container)": "Planning (Container)"
            Laufende Befehle: Running Commands
            Quick-Setup-Guide: Quick-Setup-Guide
            Berechtigungskonzept: Permission Concept
            Account-Verifizierung: Account-Verification
            Bot-Module: Bot Modules
            Einrichtung: Setup
            Benachrichtigungen: Notifications

nav:
  - Startseite: index.md
  - Off-Planungstool:
      - "Schritt 1: Truppen": off-planner/schritt1-truppen.md
      - "Schritt 2: Abschickzeiten": off-planner/schritt2-abschickzeiten.md
      - "Schritt 3: Ankunftszeiten": off-planner/schritt3-ankunftszeiten.md
      - "Schritt 4: Angriffsplanung": off-planner/schritt4-angriffsplanung.md
      - "Schritt 5: Fakeplanung": off-planner/schritt5-fakeplanung.md
      - "Schritt 6: Übersicht": off-planner/schritt6-uebersicht.md
      - "Schritt 7: Berechnung": off-planner/schritt7-berechnung.md
      - "Schritt 8: Ergebnis": off-planner/schritt8-ergebnis.md
      - Die Gesamtkarte: off-planner/gesamtkarte.md
  - AG-Planungstool:
      - Video-Tutorial: ag-planner/allgemein.md
      - Die zwei Wege: ag-planner/die-zwei-wege.md
      - "Schritt 1: AG-Meldungen": ag-planner/schritt1-ag-meldungen.md
      - "Schritt 2: Zieldörfer": ag-planner/schritt2-zieldoerfer.md
      - "Schritt 3: Einstellungen": ag-planner/schritt3-einstellungen.md
      - "Schritt 4: Ergebnis": ag-planner/schritt4-ergebnis.md
      - Die Gesamtkarte: ag-planner/gesamtkarte.md
  - Zwischencleaner & Fake-UT:
      - "Schritt 1: Truppen": cleaner-fake-ut/schritt1-truppen.md
      - "Schritt 2: Befehle": cleaner-fake-ut/schritt2-befehle.md
      - "Schritt 3: Cleaner": cleaner-fake-ut/schritt3-cleaner.md
      - "Schritt 4: Fake-UT": cleaner-fake-ut/schritt4-fake-ut.md
      - "Schritt 5: Ergebnis": cleaner-fake-ut/schritt5-ergebnis.md
  - Meine Pläne & Container:
      - Gespeicherte Pläne: meine-plaene/gespeicherte-plaene.md
      - Veröffentlichte Container: meine-plaene/container.md
  - Der Leaderview:
      - Berechtigung: leader-view/uebersicht.md
      - Mitglieder: leader-view/mitglieder.md
      - Truppen: leader-view/truppen.md
      - Bunker-Info: leader-view/bunker-info.md
      - Stammes-Umfragen: leader-view/stammes-umfragen.md
      - "Planung (Container)": leader-view/planung.md
      - Laufende Befehle: leader-view/laufende-befehle.md
  - Discordbot:
      - Quick-Setup-Guide: discord-bot/quick-setup.md
      - Berechtigungskonzept: discord-bot/berechtigungskonzept.md
      - Account-Verifizierung: discord-bot/verifizierung.md
      - Bot-Module:
          - Einrichtung: discord-bot/modul-verwaltung.md
          - Account-Sitting-System: discord-bot/sitting-system.md
          - Bunker-Information-System: discord-bot/bunker-info.md
          - Off/Deff/Snob-Search-System: discord-bot/search-system.md
          - Planning-System: discord-bot/planning-system.md
  - Benachrichtigungen: benachrichtigungen.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
